# Single source of truth for pipeline thresholds and model hyperparameters.
# Values marked "tune" are starting points to be confirmed by `make eval`.

data:
  # Moved from datarepo.eng.ucsd.edu/mcauley_group/... (404 as of 2026-09).
  base_url: https://mcauleylab.ucsd.edu/public_datasets/gdrive/goodreads/
  files:
    books: goodreads_books.json.gz
    works: goodreads_book_works.json.gz
    authors: goodreads_book_authors.json.gz
    genres: goodreads_book_genres_initial.json.gz
    # Swap to goodreads_interactions_dedup.json.gz for a much larger ratings signal.
    ratings: goodreads_reviews_dedup.json.gz

catalog:
  min_raters: 20            # tune: distinct raters per work (after edition collapse)
  languages: ["", "eng", "en-US", "en-GB", "en-CA"]
  min_user_ratings: 3       # users kept in the training matrix
  ya_min_share: 0.22        # YA flag: parent genre Young Adult, or >= this share of UCSD genre votes are "young-adult"

eval:
  n_test_users: 10000
  min_test_user_ratings: 10
  holdout_frac: 0.3
  n_buckets: [1, 3, 5, 10, 25, -1]   # -1 = all visible ratings
  k: 20
  seed: 42

item_knn:
  k: 50                     # tune
  shrinkage: 25             # tune
  min_corated: 5
  block: 500

als:
  factors: 64               # 128 not yet evaluated
  regularization: 1.0       # tuned (sweep 2026-09-26; blend insensitive, ALS-only best)
  iterations: 15
  alpha: 30.0               # tuned: confidence scale
  confidence: {5: 1.0, 4: 0.7, 3: 0.3, 0: 0.2}   # 1-2 star ratings are not positives
  min_user_ratings_for_neighbors: 10

blend:
  candidates: 300
  k_a: 20                   # tuned 2026-09-26 (eval grid): a(n) = n / (n + k_a)
  beta_pop: 0.0             # tuned: popularity weight for new users (interpolated by a(n))...
  beta_pop_many: -0.3       # ...toward this for heavy raters (penalty raised NDCG at n=all + coverage)
  gamma_quality: 0.0        # tuned (quality prior did not help NDCG)
  pred_floor_offset: 0.25   # For you drops books predicted below (your average - 0.25); null = off. Eval: -4% NDCG full history (vs -10% at 0.0)
  # Best match: + a(n) * delta_pred * fame * z(predicted rating). fame = 0 at 10^lo Goodreads ratings, 1 at 10^hi,
  # so well-known books you'd likely love move up while obscure high-average books don't.
  # Eval 2026-09-27 (993 users, NDCG@20 full history): 0.75/5.5 -> -5.6%; 0.75/6 -> -4.0%; 1.0/6 -> -6.9%; 1.0/5.5 -> -7.9%
  # Re-run after Goodreads-shrunk item means + evidence-gated calibration: 0.75/5.5 -> -4.1%; 1.0/5.5 -> -6.4%
  delta_pred: 0.75
  pred_fame_lo: 4.0         # 10k ratings
  pred_fame_hi: 5.5         # ~316k ratings
  pred_pool: 50             # famous high-prediction books added to the candidate pool
  bayes_m: 50               # item mean = dataset average shrunk toward the Goodreads-wide average by this many ratings (s10)

similar_readers:
  n_neighbors: 300
  min_user_ratings: 5
  pop_damping: 0.5

chat:                       # "Assistant" tab (src/goodrec/api/chat.py); needs ANTHROPIC_API_KEY
  # Two tiers: a quick Haiku call labels each typed message simple/complex (starter buttons carry a fixed tier).
  # Once a conversation reaches the complex tier it stays there (switching models re-writes the prompt cache).
  models:
    simple:  {model: claude-haiku-4-5-20251001, label: Haiku 4.5, effort: null}
    complex: {model: claude-sonnet-5, label: Sonnet 5, effort: medium}   # effort: low | medium | high
  router_model: claude-haiku-4-5-20251001
  max_tokens: 16000         # includes the model's thinking; too low and thinking crowds out the answer
  max_tool_rounds: 6        # model <-> tool round trips per user message
  web_search_tool: web_search_20250305
  web_search_max_uses: 3    # per user message
  per_visitor_daily: 40     # user messages per IP per day (in-memory, per instance)
  global_daily: 1500        # user messages per day across all visitors (per instance)
  max_turns: 30             # user messages per conversation
  library_max_lines: 2500   # rated books listed in full in the system prompt; beyond that, 1-2 and 4-5 stars only
