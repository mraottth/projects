# Goodreads shelf -> genre tag map, applied by `make genres` (s06_genres).
# Drafted by Claude from the top 500 shelves in data/interim/shelf_candidates.tsv; review and edit freely.
#   keep:    false = ignored (reading status, ownership, formats, or too broad to discriminate)
#   display: tag shown in the UI; synonyms share a display name so they merge
#   parent:  one of `parents` (or null for cross-cutting themes/settings); a work's parent genre is
#            the parent with the largest share of its kept shelves
# To regenerate with the API instead: `make genres-draft` (needs ANTHROPIC_API_KEY).

parents:
  - Literary Fiction
  - Contemporary Fiction
  - Historical Fiction
  - Classics
  - Mystery & Crime
  - Thriller & Suspense
  - Horror
  - Science Fiction
  - Fantasy
  - Paranormal & Urban Fantasy
  - Romance
