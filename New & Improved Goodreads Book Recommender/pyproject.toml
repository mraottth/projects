[project]
name = "goodrec"
version = "0.1.0"
description = "Goodreads book recommender (UCSD Book Graph data)"
requires-python = ">=3.12,<3.13"
# Serving dependencies only; the offline pipeline and eval live in dependency groups.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "scipy>=1.13",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[dependency-groups]
pipeline = [
    "polars>=1.0",
    "pyarrow>=16",
    "requests>=2.32",
    "tqdm>=4.66",
    "implicit>=0.7.2",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodrec"]

[tool.uv]
default-groups = ["pipeline", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
