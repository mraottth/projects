# The Job Search Assistant's public site on GitHub Pages (asked 2026-11-11): a welcome page at
# <pages url>/job-search/ (D-033) and a read-only demo with fictional data at <pages url>/jsa-demo/
# (D-032). No secrets: it makes no Claude calls and never touches the real app or its data. The repo
# variable JSA_APP_URL (the app's address) fills the sign-in links; without it they're hidden.
name: Job Search Assistant demo

on:
  push:
    branches: [main]
    paths:
      - "01 - Claude Code Projects/02 - Job Search Assistant/**"
      - ".github/workflows/jsa-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "01 - Claude Code Projects/02 - Job Search Assistant"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the Timeline is built from the commit history
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record the demo and build the site
        run: make demo JSA_APP_URL="$JSA_APP_URL"
        env:
          JSA_APP_URL: ${{ vars.JSA_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "01 - Claude Code Projects/02 - Job Search Assistant/frontend/dist-site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}job-search/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
